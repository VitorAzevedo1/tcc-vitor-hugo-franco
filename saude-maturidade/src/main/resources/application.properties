spring.application.name=saude-maturidade

# ===== H2 (banco em memoria para desenvolvimento inicial) =====
spring.datasource.url=jdbc:h2:mem:saudedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Console web do H2 (para ver o banco no navegador) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Flyway desabilitado por enquanto (vamos configurar quando trocar pro MySQL) =====
spring.flyway.enabled=false

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha